version: 2
updates:
  - package-ecosystem: npm
    directories:
      - /
      - /cli
      - /desktop
      - /web
      - /inference
      - /integrations/pi
      - /packages/*
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      javascript-tooling:
        dependency-type: development
      javascript-runtime:
        dependency-type: production
  - package-ecosystem: cargo
    directory: /inference
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
  - package-ecosystem: pip
    directories:
      - /packages/inference-benchmark/engines/mlx-lm
      - /packages/inference-benchmark/engines/mlx-vlm
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
