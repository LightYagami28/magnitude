version: 2
updates:
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      javascript-tooling:
        dependency-type: development
      javascript-runtime:
        dependency-type: production
  - package-ecosystem: cargo
    directory: /inference
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
